[Main]
; Shipped defaults. MCM writes your choices to MCM\Settings\CorpseHighlighterF4.ini,
; which overrides this file key by key.

; 1 = highlight actors when they die
bEnabled=1

; Dropdown index of the highlight shader (see config.json options).
; 2 = Detect Life Hostile (red mist), 8 = Custom (uses the two keys below)
iShader=2

; 1 = the glow stops once you open the body or take anything from it
bStopWhenLooted=1

; Only highlight deaths within this range of the player, in game units.
; 0 = unlimited. Roughly 70 units per metre.
fMaxDistance=0

; Used only when iShader=8 (Custom): any effect shader (EFSH) form.
sCustomShaderPlugin=Fallout4.esm
sCustomShaderFormID=0x0022517E
